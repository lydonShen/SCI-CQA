 2 and 3, their results are reported in ``Task Completion Rate / Task Success Rate'' format. The ``w/o manual'' means ablating appliance manuals input for the above methods.",context:"The experimental results on different tasks and appliance categories are summarized in Table tab:result. As shown in Table tab:result, the manual plays a crucial role in guiding the robot to accurately plan and execute manipulation tasks, underscoring its importance in completing appliance manipulation tasks.",image:"samples/images/6fe277a68dce796cf84baaf0.png",source:"raw"},{record_id:"ffb26a2c56e483c60be2a997",paper_id:"arxiv:1804.02836",kind:"figure",label:"fig:reflected",caption:"Reflected component is decomposed into L s,d (p) directly reaching the surface from the source and the source-surface forward scatter component L s,f (p) .",context:"In participating media, L(p) is decomposed into a reflected component L s(p) (Figure fig:reflected), a backscatter component L b(p) (Figure fig:backscatter), and a forward scatter component L f(p) (Figure fig:forwardscatter) as follows: equation L(p) = L s(p) e -cd vp + L b(p) + L f(p). pdf Backscatter component is the sum of scattered light on the viewline without reaching the surface fig:backscatter figure Reflected component As shown in Figure fig:reflected, the reflected component is decomposed into L s,d (p) directly reaching the surface and the source-surface forward scatter component L s,f (p) : equation L s(p) = L s,d (p) + L s,f (p).",image:"samples/images/ffb26a2c56e483c60be2a997.jpg",source:"rendered"},{record_id:"8275b032e1ecae02ed90f4c2",paper_id:"arxiv:2105.04489",kind:"table",label:"table:loss_comparison",caption:"Loss Function Comparison for Video/Caption Retrieval on Full Test Set: Models trained on four datasets evaluated for video/caption retrieval on their full test sets.",context:"We refer to this as an Adaptive Mean Margin (AMM) for contrastive learning and show in Section sec:results the effect of applying this adaptive margin. In Table table:loss comparison we compare the Video/Caption Retrieval In Tables table:language model comparison retrieval, table:loss comparison and table:audio model comparison retrieval we show results of R@k recall scores (for k=1,5,10 ) and mean average precision (mAP) on both caption to video and video to caption retrieval. In Table table:loss comparison we compare the Video/Caption Retrieval In Tables table:language model comparison retrieval, table:loss comparison and table:audio model comparison retrieval we show results of R@k recall scores (for k=1,5,10 ) and mean average precision (mAP) on both caption to video and video to caption retrieval. Each model in Tables table:language model comparison retrieval and table:loss comparison uses the output of a pretrained ASR model, the Google Cloud ASR engine, as input into a trained language model to generate a feature representation for each caption. We evaluate the AMM loss in Table table:loss comparison where we compare the results on the NCE, SHN, MMS and AMM loss functions described in Sections sec:related loss and sec:approach on four different datasets (the proposed Spoken Moments in Time dataset (S-MiT) as well as Vatex-en Wang 2019 ICCV, MSR-VTT xu2016msr-vtt and ActivityNet Captions We used the groundtruth timestamps to get corresponding video clips. 1 The proposed AMM loss function consistently achieves the best results across each dataset in Table table:loss comparison and the BART language model provides the strongest representations for the retrieval task in Table table:language model comparison retrieval. Table table:loss comparison shows a comparison of our AMM approach to other methods for cross-modal contrastive learning. Each model in this evaluation was trained using the BART lewis2019bart language model and the proposed AMM loss function which was found to give the best results (see Tables table:language model comparison retrieval, table:loss comparison). Caption Datasets There have been a number of different datasets released for providing language descriptions of visual information.",image:"samples/images/8275b032e1ecae02ed90f4c2.png",source:"raw"},{record_id:"e58ef863784f4128223b1b23",paper_id:"arxiv:2305.07528",kind:"figure",label:"fig2",caption:"Sim2Real Distribution Gap: Object frequency distribution in WEDGE and DAWN datasets.",context:"Experiments sec:exp Image Analysis The classic autonomous vehicle settings contain skewed object distributions which we attempt to model with this generated dataset as visible in Figure fig2.",image:"samples/images/e58ef863784f4128223b1b23.png",source:"raw"},{record_id:"4bcc4a17350efd198bd36342",paper_id:"arxiv:1804.00413",kind:"figure",label:"Fig:tvnet",caption:"(a) The multi-scale version of the TV-L1 method. Here the scale-size, N scales is 3. (b) The illustration of the process for unfolding TV-L1 to TVNet. Here, we only illustrate the while-loop of Algorithm Alg:tvl1 for simplicity. Given two consecutive images I 0 and I 1 , we iteratively compute the immediate variables I 1(x+u 0), I 1(x+u 0), v, p and the optical flow u . The computations related to v, p and u is called recursively. The updates denoted as red line is parameterized by certain parameters which can be fine-tuned by end-to-end training. (c) The end-to-end model for action recognition.",context:"First, the iterations in Algorithm Alg:tvl1 can be unfolded as a fixed-size feed-forward network if we fix the number of the iterations within the while-loop to be N iters (see Figure Fig:tvnet). Multi-task Loss As discussed before, our TVNet can be concatenated to any task-specific networks ( , the BN-Inception net for action classification Wang ECCV16) to perform end-to-end action recogntion without the need of explicitly extracting the optical flow data, as illustrated in Figure Fig:tvnet (c). Figure Fig:tvnet demonstrates the framework of TV-L1 with the number of scales being N scales =3 .",image:"samples/images/4bcc4a17350efd198bd36342.jpg",source:"rendered"},{record_id:"a8e73c5af7bf46e7c3cf9293",paper_id:"arxiv:1511.03240",kind:"figure",label:"fig:geometric_unary_potentials",caption:"Geometric Unary Potentials. Left: We encourage label changes at 3D curbs or folds after projection into the image domain. Right: This constraint ( mi ) is implemented by pixel unary potentials inside each minimum bounding disc m around each 2D curb or fold segment m .",context:"rages semantic label coherence and connects all pixels in the image via Gaussian edge kernels eqnarray && ij , (s i,s j) = w 1 , (s i,s j) \\ - i - j 2 2\\, 1 , \\ \\\\ &&+\\, w 2 , (s i,s j) \\ - i - j 2 2\\, 2 , - i - j 2 2\\, 3 , \\ 0.6cm eqnarray where i is the 2D location of pixel i and i denotes its color value. Further, w 1 , and w 2 , are learned pairwise feature weights and , parametrizes the kernel width. figure[t] model/model fold semantic Geometric Unary Potentials. Left: We encourage label changes at 3D curbs or folds after projection into the image domain. Right: This constraint ( mi ) is implemented by pixel unary potentials inside each minimum bounding disc m around each 2D curb or fold segment m . fig:geometric unary potentials -0.4cm figure \\bf 3D Pairwise Potentials: Similarly, we apply a Gaussian edge kernel to encourage label consistency between 3D points based on their 3D location and surface normals eqnarray lk , (s l,s k) &=& w , (s l,s k)\\\\ & & \\ - l 3d - k 3d 2 2\\, 1 , - (n l - n k ) 2 2\\, 2 , \\ eqnarray where 3d l is the 3D location of point l and n l denotes the vertical (up) component of its normal. We use the normal's z-component as it is the most discriminative cue for indicating label changes between horizontal ( , road, sidewalk) and vertical",image:"samples/images/a8e73c5af7bf46e7c3cf9293.jpg",source:"rendered"},{record_id:"1b2b1ef759be27551f6bd2d2",paper_id:"arxiv:2206.02116",kind:"figure",label:"fig:augmentation",caption:"Augmentations of tracklets. The solid lines denote ground-truth box annotations, and the dotted lines are region proposals from RPN. (a) Because annotating a video requires huge efforts, video datasets have sparse labels that are insufficient to train large vocabularies. (b) Tracklets can be diversified from substitution of box labels with region proposals. (c) Further supervision to tail classes can be derived from mixtures of tracklets, having multiple classes.",context:"fig/module Tracklet Augmentations sec:tracklet augmentations In this section, we describe data augmentation methods for generating tracklets to resolve the data shortage issue (fig:augmentation (a)). Tracklets from region proposals Instead of using only the ground-truth box labels, we combine numerous regional proposals of RPN in multiple frames to generate tracklets with new views (fig:augmentation (b)). To diversify the tracklets and expose more tail classes, we propose to further augment tracklets to have multi-identity and multi-class tracklets (fig:augmentation (c)). The augmentation of tracklets using regional proposals, but not allowing them to be composed of multiple identities and multiple classes (fig:augmentation (b)) leads to the accuracy of 17. Mixing RoIs of different identities (fig:augmentation (c)) can be divided into two, depending on whether composing tracklets with RoIs of multiple classes is granted or not.",image:"samples/images/1b2b1ef759be27551f6bd2d2.jpg",source:"rendered"},{record_id:"80ac88e7101dc2f56f2e7a45",paper_id:"arxiv:2304.06249",kind:"table",label:"tab:disentangle_burst_arc",caption:"Ablation of vocabulary-based burst suppression on entangled and disentangled models with ArcFace backbone.",context:"The observations on the ArcFace-based model are similar and corresponding result comparisons are presented in Table tab:disentangle arc and Table tab:disentangle burst arc. As can be seen in Table tab:disentangle burst arc, the proposed VBS is effective on both the entangled and disentangled models with considerable performance improvement.",image:"samp
